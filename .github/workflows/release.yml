name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-aarch64 }
          - { os: macos-14, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          pkg="oso-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$pkg"
          if [ "${{ matrix.name }}" = windows-x86_64 ]; then
            cp "target/${{ matrix.target }}/release/oso.exe" LICENSE README.md "$pkg/"
            7z a -tzip "$pkg.zip" "$pkg" >/dev/null
            ext=zip
          else
            cp "target/${{ matrix.target }}/release/oso" LICENSE README.md "$pkg/"
            tar czf "$pkg.tar.gz" "$pkg"
            ext=tar.gz
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$pkg.$ext" > "$pkg.$ext.sha256"; else shasum -a 256 "$pkg.$ext" > "$pkg.$ext.sha256"; fi
          echo "ASSET=$pkg.$ext" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --notes-file RELEASE_NOTES.md
