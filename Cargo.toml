[package]
name = "ship-ssh-manager"
version = "0.9.5"
edition = "2024"
description = "A terminal SSH connection manager: folders, jump hosts, tabs, mouse support and an encrypted password vault"
license = "MIT"
repository = "https://github.com/seyadog/ship-ssh-manager"
keywords = ["ssh", "tui", "terminal", "connection-manager"]
categories = ["command-line-utilities"]

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
crossterm = "0.29.0"
directories = "6.0.0"
getrandom = "0.4.3"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
unicode-width = "0.2.2"
vt100 = "0.16.2"
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
